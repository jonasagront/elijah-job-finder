# Eightfold career sites: host is the careers site address, domain is the
# `domain=` value in the site's /api/pcsx/search requests.
eightfold_search = ["new grad", "entry level", "early career", "university", "intern"]
eightfold = [
  { name = "Microsoft", host = "apply.careers.microsoft.com", domain = "microsoft.com" },
]

# --- Big job lists maintained on GitHub by Simplify --------------------
# New-grad / entry-level roles (thousands, updated daily).
[[list]]
name = "Simplify New Grad list"
kind = "entry"
urls = ["https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json"]
# Simplify's own categories to keep (others: Hardware, Product).
categories = ["Software", "AI/ML/Data", "Quant"]

# Internships. Most want a current student, but some take recent grads.
[[list]]
name = "Simplify internship list"
kind = "intern"
urls = [
  "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json",
  "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/main/.github/scripts/listings.json",
]
categories = ["Software", "AI/ML/Data"]

# --- Federal jobs via USAJOBS (Recent Graduates program) ---------------
# The Pathways Recent Graduates program is open for 2 years after graduation.
# Free API key: https://developer.usajobs.gov/apirequest/
# Then add USAJOBS_API_KEY and USAJOBS_EMAIL as repo secrets (see README).
[usajobs]
hiring_path = "graduates"
keywords = ["computer science", "information technology", "IT specialist", "computer engineer", "data science"]

