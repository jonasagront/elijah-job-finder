# Workday career sites (most large companies).
# host + site come straight from the company's careers URL, e.g.
#   https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#        ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ host ^^^^^^^^^^^^^^^^^^^^^^^^ site
# Workday has no "list everything" option, so each site is searched for
# the words in workday_search below.
workday_search = ["new grad", "entry level", "early career", "university", "associate", "junior", "intern"]
workday = [
  # Florida employers
  { name = "Motorola Solutions", host = "motorolasolutions.wd5.myworkdayjobs.com", site = "Careers" },
